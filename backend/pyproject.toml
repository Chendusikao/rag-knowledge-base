[project]
name = "wendaxitog-backend"
version = "0.1.0"
description = "Enterprise multimodal RAG knowledge base Q&A system - backend scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "SQLAlchemy==2.0.35",
    "alembic==1.13.3",
    "aiosqlite==0.20.0",
    "rank_bm25==0.2.2",
    "httpx==0.27.2",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2", "pytest-asyncio==0.24.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
